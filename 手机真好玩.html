<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>爷和我</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .ye {
            font-size: 200px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .say {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin-top: -200px;
            font-size: 30px;
            border: 2px solid black;
            border-radius: 20px;
            padding: 10px 20px;
            background: white;
            white-space: nowrap;
        }

        .wo {
            font-size: 200px;
            position: absolute;
            left: 0;
            top: 0;
            transition: all 2s;
        }
    </style>
</head>
<body>
    <div class="ye">爷</div>
    <div class="say" id="say">我在看手机</div>
    <div class="wo" id="wo">我</div>

    <script>
        var wo = document.getElementById('wo');
        var ye = document.querySelector('.ye');
        var say = document.getElementById('say');

        function moveWo() {
            var oldX = wo.offsetLeft;
            var oldY = wo.offsetTop;

            var x, y;
            var tries = 0;

            do {
                x = Math.random() * (window.innerWidth - wo.offsetWidth);
                y = Math.random() * (window.innerHeight - wo.offsetHeight);
                tries++;
            } while (tries < 20 && Math.sqrt((x - oldX) * (x - oldX) + (y - oldY) * (y - oldY)) < 600);

            wo.style.left = x + 'px';
            wo.style.top = y + 'px';
        }

        function checkDistance() {
            var yeRect = ye.getBoundingClientRect();
            var woRect = wo.getBoundingClientRect();

            var yeX = yeRect.left + yeRect.width / 2;
            var yeY = yeRect.top + yeRect.height / 2;
            var woX = woRect.left + woRect.width / 2;
            var woY = woRect.top + woRect.height / 2;

            var dx = yeX - woX;
            var dy = yeY - woY;
            var distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 350) {
                say.textContent = '你干嘛';
            } else {
                say.textContent = '我在看手机';
            }
        }

        moveWo();
        setInterval(moveWo, 2000);
        setInterval(checkDistance, 100);
    </script>
</body>
</html>

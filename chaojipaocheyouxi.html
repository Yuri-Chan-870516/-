<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>超级跑车 · 3D 赛车</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#102033;color:white;font-family:system-ui}canvas{display:block}#hud{position:absolute;top:max(24px,env(safe-area-inset-top));left:24px;pointer-events:none}small{color:#a9bfd0;letter-spacing:3px}#score{font-size:38px;font-weight:800}#hint{position:absolute;top:28px;right:24px;color:#c5d7e5;font-size:13px}#panel{position:absolute;inset:0;display:grid;place-items:center;background:#08142280}.card{text-align:center;background:#122739ee;border:1px solid #48677d;border-radius:24px;padding:32px;max-width:90vw}button{border:0;border-radius:16px;background:#ffd366;color:#23303a;padding:16px 32px;font-size:18px;font-weight:bold;cursor:pointer}h1{margin-top:0}p{color:#b9cddd;line-height:1.8}#touch{display:none}body.mobile #touch{display:block}#stick{position:absolute;left:max(28px,env(safe-area-inset-left));bottom:max(35px,env(safe-area-inset-bottom));width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff15}#knob{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;pointer-events:none}#jump{position:absolute;right:max(28px,env(safe-area-inset-right));bottom:max(48px,env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;padding:0;background:#ffd366da}#restart{position:absolute;right:24px;top:65px;font-size:13px;padding:9px 15px;background:#ffffff22;color:white}@media(max-width:600px){#hint{max-width:150px;font-size:11px}#score{font-size:30px}}</style></head><body><div id="hud"><small>超级跑车 / COIN DRIVE</small><div id="score">0</div><span id="speed">准备出发</span></div><div id="hint"></div><button id="restart">重新开始</button><div id="touch"><div id="stick"><div id="knob"></div></div><button id="jump">跳跃 ↑</button></div><div id="panel"><div class="card"><small>3D ARCADE RACER</small><h1 id="title">超级跑车</h1><p id="desc">收集金币，避开路障。<br>越跑越快，看看你能跑多远！</p><button id="start">开始驾驶</button></div></div><script src="three.min.js"></script><script>
'use strict';
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.body.classList.toggle('mobile',mobile);document.querySelector('#hint').textContent=mobile?'左右拨动摇杆变道 · 点击跳跃':'A / D 或 ← → 变道 · 空格跳跃 · R 重开';
const scene=new THREE.Scene();scene.background=new THREE.Color('#182d43');scene.fog=new THREE.Fog('#182d43',35,100);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(0,6.5,11);camera.lookAt(0,0,-10);
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){document.querySelector('#desc').textContent='浏览器无法启动 WebGL，请开启硬件加速后重试。';throw e}renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7ebff,0x334155,2));const sun=new THREE.DirectionalLight(0xffe5bf,3);sun.position.set(-8,15,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-12,right:12,top:25,bottom:-25});scene.add(sun);
const mat=(c,metal=0,rough=.55)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});const blue=mat('#138ee0',.55,.25),glass=mat('#9bd9ef',.4,.18),rubber=mat('#20242b'),steel=mat('#9ba6af',.7),gold=mat('#ffce45',.8,.22),darkGold=mat('#b78019',.8,.3),orange=mat('#f06a24'),white=mat('#fff2d4');
function box(parent,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(scene,13,.2,150,0,-.2,-45,mat('#293747'));for(const x of [-6.5,6.5])box(scene,.12,.18,150,x,0,-45,mat('#49cbd6'));
const marks=[];for(let z=-95;z<15;z+=5)for(const x of [-2,2])marks.push(box(scene,.09,.015,2,x,-.085,z,white));
const car=new THREE.Group();scene.add(car);box(car,1.15,.42,2.05,0,.37,0,blue);box(car,.87,.43,1.02,0,.76,.12,blue);box(car,.76,.30,.025,0,.78,-.405,glass);box(car,.76,.30,.025,0,.78,.64,glass);for(const x of [-.445,.445])box(car,.025,.3,.82,x,.78,.12,glass);for(const x of [-.61,.61])for(const z of [-.65,.65]){const tire=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.22,20),rubber);tire.rotation.z=Math.PI/2;tire.position.set(x,.23,z);tire.castShadow=true;car.add(tire);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.235,16),steel);hub.rotation.z=Math.PI/2;hub.position.copy(tire.position);car.add(hub)}for(const x of [-.36,.36]){box(car,.25,.13,.04,x,.43,-1.04,white);box(car,.25,.12,.04,x,.43,1.04,mat('#e93c44'))}box(car,.95,.1,.09,0,.23,-1.08,steel);
let lane=1,elapsed=0,coins=0,spawn=0,vy=0,running=false,objects=[];const lanes=[-4,0,4],panel=document.querySelector('#panel');let stickPointer=null,stickDirection=0;
function steer(d){if(running)lane=Math.max(0,Math.min(2,lane+d))}function jump(){if(running&&car.position.y<=.001)vy=8.7}
function resetStick(){stickPointer=null;stickDirection=0;document.querySelector('#knob').style.transform='';}
function removeObject(o){scene.remove(o);o.traverse(child=>{if(child.isMesh){if(![coinGeo,faceGeo,rimGeo].includes(child.geometry))child.geometry.dispose()}})}
function start(){for(const o of objects)removeObject(o);objects=[];lane=1;elapsed=coins=spawn=vy=0;car.position.set(0,0,0);car.rotation.set(0,0,0);resetStick();panel.style.display='none';running=true}
document.querySelector('#start').onclick=start;document.querySelector('#restart').onclick=start;document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();jump()};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.repeat)return;if(['a','A','ArrowLeft'].includes(e.key))steer(-1);if(['d','D','ArrowRight'].includes(e.key))steer(1);if(e.code==='Space')jump();if(e.key.toLowerCase()==='r')start()});
const stick=document.querySelector('#stick');stick.onpointerdown=e=>{if(stickPointer!==null)return;stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)};function moveStick(e){if(e.pointerId!==stickPointer)return;const r=stick.getBoundingClientRect(),dx=Math.max(-40,Math.min(40,e.clientX-r.left-r.width/2)),dy=Math.max(-35,Math.min(35,e.clientY-r.top-r.height/2));document.querySelector('#knob').style.transform=`translate(${dx}px,${dy}px)`;const d=Math.abs(dx)>18?Math.sign(dx):0;if(d&&d!==stickDirection)steer(d);stickDirection=d}stick.onpointermove=moveStick;stick.onpointerup=stick.onpointercancel=resetStick;addEventListener('blur',resetStick);
// Shared geometry/materials prevent GPU memory growth across restarts.
const coinGeo=new THREE.CylinderGeometry(.47,.47,.14,40),faceGeo=new THREE.CylinderGeometry(.39,.39,.155,40),rimGeo=new THREE.TorusGeometry(.425,.022,8,40);
function cylinder(parent,geo,m){const mesh=new THREE.Mesh(geo,m);mesh.rotation.x=Math.PI/2;mesh.castShadow=true;parent.add(mesh);return mesh}
function createObject(){const coin=Math.random()<.43,o=new THREE.Group();o.userData.coin=coin;o.position.set(lanes[Math.floor(Math.random()*3)],coin?1:.02,-75);if(coin){cylinder(o,coinGeo,darkGold);cylinder(o,faceGeo,gold);for(const z of [-.09,.09]){const rim=new THREE.Mesh(rimGeo,gold);rim.position.z=z;o.add(rim);box(o,.07,.46,.02,.02,0,z,white);box(o,.23,.05,.02,0,-.22,z,gold);box(o,.14,.05,.02,-.04,.18,z,gold)}}else{for(const x of [-.72,.72]){box(o,.5,.18,.8,x,.07,0,rubber);box(o,.09,1.12,.1,x,.63,0,steel);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.10,12,8),gold);lamp.position.set(x,1.27,0);o.add(lamp)}for(const y of [.53,.94]){box(o,1.95,.32,.15,0,y,0,orange);for(const z of [-.082,.082])for(const x of [-.76,-.38,0,.38,.76]){const stripe=box(o,.15,.27,.015,x,y,z,white);stripe.rotation.z=-.36}}}scene.add(o);objects.push(o)}
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.04);last=now;if(running){elapsed+=dt;const speed=Math.min(13+elapsed*.16,27),offset=lanes[lane]-car.position.x;car.position.x+=Math.sign(offset)*Math.min(Math.abs(offset),18*dt);car.rotation.z=THREE.MathUtils.damp(car.rotation.z,-Math.max(-1,Math.min(1,offset/2))*.13,12,dt);car.rotation.y=THREE.MathUtils.damp(car.rotation.y,-offset*.06,12,dt);vy-=23*dt;car.position.y=Math.max(0,car.position.y+vy*dt);if(car.position.y===0)vy=Math.max(0,vy);for(const m of marks){m.position.z+=speed*dt;if(m.position.z>15)m.position.z-=110}spawn-=dt;if(spawn<=0){createObject();spawn=.7+Math.random()*.35}for(let i=objects.length-1;i>=0;i--){const o=objects[i],c=o.userData.coin;o.position.z+=speed*dt;if(c)o.rotation.y+=dt*2;const hit=Math.abs(o.position.x-car.position.x)<(c?1.04:1.55)&&Math.abs(o.position.z)<(c?1.3:1.45)&&(c?Math.abs(1-(car.position.y+.55))<.95:car.position.y<1.26);if(hit){if(c){coins++;removeObject(o);objects.splice(i,1)}else{running=false;resetStick();document.querySelector('#title').textContent='撞到路障了';document.querySelector('#desc').textContent=`得分 ${Math.floor(elapsed*10)+coins*100} · 收集 ${coins} 枚金币`;document.querySelector('#start').textContent='再来一局';panel.style.display='grid';break}}else if(o.position.z>18){removeObject(o);objects.splice(i,1)}}document.querySelector('#score').textContent=Math.floor(elapsed*10)+coins*100;document.querySelector('#speed').textContent=`金币 ${coins}   ·   ${Math.round(speed*5)} km/h`}camera.position.x=THREE.MathUtils.damp(camera.position.x,car.position.x*.25,4,dt);renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.addEventListener('visibilitychange',()=>{last=performance.now();resetStick()});
</script></body></html>
